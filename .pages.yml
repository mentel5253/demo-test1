media:
  - name: images
    label: תמונות
    input: media/images
    output: /media/images
    categories: [image]
    extensions: [png, jpg, jpeg, webp]
    rename: safe

content:
  - name: site
    label: הגדרות האתר
    type: file
    path: content/site.json
    fields:
      - name: brand
        label: שם המותג
        type: string
      - name: base_url
        label: כתובת האתר
        type: string
      - name: default_language
        label: שפה
        type: string
      - name: default_robots
        label: Robots
        type: string

  - name: pages
    label: דפי אתר
    type: collection
    path: content/pages
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Meta Title
            type: string
          - name: description
            label: Meta Description
            type: text
          - name: canonical
            label: Canonical URL
            type: string
          - name: robots
            label: Robots
            type: string
          - name: og_title
            label: OG Title
            type: string
          - name: og_description
            label: OG Description
            type: text
          - name: og_image
            label: OG Image
            type: image
            options:
              media: images
              path: media/images
      - name: site
        label: ניווט ולוגו
        type: object
        fields:
          - name: logo
            label: לוגו
            type: object
            fields:
              - name: src
                label: קובץ לוגו
                type: image
                options:
                  media: images
                  path: media/images
              - name: alt
                label: ALT
                type: string
          - name: home_url
            label: קישור בית
            type: string
          - name: home_button
            label: כפתור בית
            type: string
          - name: nav
            label: תפריט
            type: object
            list: true
            fields:
              - name: label
                label: טקסט
                type: string
              - name: href
                label: קישור
                type: string
      - name: hero
        label: אזור פתיחה
        type: object
        fields:
          - name: label
            label: תווית
            type: string
          - name: title_line1
            label: כותרת 1
            type: string
          - name: title_line2
            label: כותרת 2
            type: string
          - name: subtitle
            label: כותרת משנה
            type: string
          - name: description
            label: תיאור
            type: text
          - name: primary_button
            label: כפתור ראשי
            type: object
            fields:
              - name: text
                label: טקסט
                type: string
              - name: href
                label: קישור
                type: string
          - name: secondary_button
            label: כפתור משני
            type: object
            fields:
              - name: text
                label: טקסט
                type: string
              - name: href
                label: קישור
                type: string
      - name: stats
        label: נתונים
        type: object
        list: true
        fields:
          - name: number
            label: מספר
            type: string
          - name: text
            label: תיאור
            type: string
      - name: about
        label: למה דווקא עכשיו
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: description
            label: תיאור
            type: text
          - name: features
            label: כרטיסים
            type: object
            list: true
            fields:
              - name: title
                label: כותרת
                type: string
              - name: text
                label: טקסט
                type: text
      - name: small_uav
        label: מהו כטב"מ קטן
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: paragraph1
            label: פסקה 1
            type: text
          - name: paragraph2
            label: פסקה 2
            type: text
      - name: jobs
        label: אפשרויות תעסוקה
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: description
            label: תיאור
            type: text
          - name: items
            label: תחומים
            type: string
            list: true
      - name: why_skynext
        label: למה Sky Next
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: description
            label: תיאור
            type: text
          - name: items
            label: נקודות
            type: string
            list: true
      - name: success_package
        label: מעטפת ההצלחה
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: description
            label: תיאור
            type: text
          - name: items
            label: סעיפים
            type: object
            list: true
            fields:
              - name: icon
                label: אייקון
                type: string
              - name: title
                label: כותרת
                type: string
              - name: text
                label: טקסט
                type: text
      - name: instructor
        label: המדריך
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: image
            label: תמונת מדריך
            type: image
            options:
              media: images
              path: media/images
          - name: alt
            label: ALT
            type: string
          - name: name
            label: שם
            type: string
          - name: role
            label: תפקיד
            type: string
          - name: paragraphs
            label: טקסט
            type: text
            list: true
      - name: faq
        label: שאלות ותשובות
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: items
            label: שאלות
            type: object
            list: true
            fields:
              - name: question
                label: שאלה
                type: string
              - name: answer
                label: תשובה
                type: text
      - name: contact
        label: הרשמה ומחיר
        type: object
        fields:
          - name: tag
            label: תווית
            type: string
          - name: title
            label: כותרת
            type: string
          - name: description
            label: תיאור
            type: text
          - name: price
            label: מחיר
            type: number
          - name: payment_note
            label: הערת תשלום
            type: string
          - name: payment_button
            label: כפתור תשלום
            type: string
          - name: mode
            label: מצב תשלום
            type: select
            options:
              - label: ניסוי
                value: demo
              - label: ייצור
                value: production
          - name: fields
            label: שדות טופס
            type: object
            list: true
            fields:
              - name: name
                label: מזהה
                type: string
              - name: placeholder
                label: Placeholder
                type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: text
            label: טקסט
            type: text

settings:
  content:
    merge: true

actions:
  - name: build-site
    label: בניית האתר
    workflow: build-site.yml
    ref: current
    confirm:
      title: לבנות את האתר?
      message: הפעולה תבנה את האתר מחדש ותפרסם אותו בסביבת הניסוי.
      button: בנייה ופרסום
